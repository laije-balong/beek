name = "beek-spike-hash"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Pas de Durable Object dans ce premier deploiement. Sur le plan gratuit
# sans carte, les DO peuvent ne pas etre disponibles. On mesure d'abord le
# hachage sur un Worker simple. La route /hash-do reste inactive.

# Journaux d'invocation, pour lire le temps CPU par requete dans le tableau
# de bord Cloudflare. Inclus dans le plan gratuit, retention de 3 jours.
[observability]
enabled = true

name = "beek"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Base D1 unique, selon la simplification pour 5 apprenants.
# L'identifiant est pose par le porteur apres "wrangler d1 create beek".
[[d1_databases]]
binding = "DB"
database_name = "beek"
database_id = "4059e1fd-cee8-4742-8804-ff3b6168df53"
migrations_dir = "migrations"

# Images des exercices, 200 Ko au plus.
# L'identifiant est pose par le porteur apres "wrangler kv namespace create IMAGES".
[[kv_namespaces]]
binding = "IMAGES"
id = "aa27c1b03d9c4dcb84276c3ef4a7cdfd"
